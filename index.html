<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Portfolios</title>
<style>
:root { --bg: #F6F7F8; --ink: #14181F; --muted: #5B6472; --accent: #2B4FC7; }
@media (prefers-color-scheme: dark) { :root { --bg: #0E1114; --ink: #E7EAEE; --muted: #9AA3AE; --accent: #86A5FF; color-scheme: dark; } }
body { margin: 0; background: var(--bg); color: var(--ink); font: 1.0625rem/1.6 system-ui, sans-serif; padding: 4rem 16px; }
main { max-width: 32rem; margin: 0 auto; }
ul { list-style: none; padding: 0; display: grid; gap: .75rem; }
a { color: var(--accent); font-weight: 600; }
span { color: var(--muted); }
</style>
</head>
<body>
<main>
  <h1>Portfolios</h1>
  <ul>
    <li><a href="jibran/">Jibran Ali</a> <span>· Senior Full-Stack Engineer</span></li>
    <li><a href="arslan/">Arslan Saeed</a> <span>· Senior Software Engineer</span></li>
    <li><a href="maida/">Maida Maqbool</a> <span>· Software Engineer</span></li>
  </ul>
</main>
</body>
</html>
